# Development credentials only. Database binds to loopback, not the public network.
services:
  db:
    image: postgres:18.3-alpine
    environment:
      POSTGRES_DB: alphatrace
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: local-admin-only
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - alphatrace_pg:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d alphatrace"]
      interval: 3s
      timeout: 3s
      retries: 20
volumes:
  alphatrace_pg:
