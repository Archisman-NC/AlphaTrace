name: Web foundation
on:
  push:
    paths: ['web/**', 'scripts/research/**', '.github/workflows/web.yml']
  pull_request:
    paths: ['web/**', 'scripts/research/**', '.github/workflows/web.yml']
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18.3-alpine
        env:
          POSTGRES_DB: alphatrace
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: local-admin-only
        ports: ['55432:5432']
        options: --health-cmd 'pg_isready -U postgres' --health-interval 5s --health-timeout 5s --health-retries 10
    defaults:
      run:
        working-directory: web
    env:
      DATABASE_URL: postgresql://alphatrace_app:local-development-only@127.0.0.1:55432/alphatrace
      MIGRATION_DATABASE_URL: postgresql://postgres:local-admin-only@127.0.0.1:55432/alphatrace
      TEST_DATABASE_URL: postgresql://alphatrace_app:local-development-only@127.0.0.1:55432/alphatrace
      TEST_MIGRATION_DATABASE_URL: postgresql://postgres:local-admin-only@127.0.0.1:55432/alphatrace
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run db:migrate
      - run: psql "$MIGRATION_DATABASE_URL" -v ON_ERROR_STOP=1 -f scripts/local-role.sql
      - run: npm run db:migrate
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:db
      - run: npm run test:portfolio
      - run: npm run test:research
      - run: npm run test:monitor
      - run: npm run test:thesis
      - run: npm run test:inbox
      - run: node --import tsx tests/provider-handoff.integration.ts
      - run: npm run test:documents
      - run: python3 -m unittest discover -s ../scripts/research -p 'test_*.py'
      - run: npm run build
